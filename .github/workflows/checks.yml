name: Restaurant checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: restaurant
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: restaurant
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U restaurant" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DEBUG: "true"
      SECRET_KEY: test-only-not-a-production-secret
      DATABASE_URL: postgresql://restaurant:test-password@localhost:5432/restaurant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r requirements.lock
      - run: npm ci && npm run build
        working-directory: frontend
      - run: python manage.py collectstatic --noinput
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test restaurant.tests --verbosity 2
      - run: python manage.py check --deploy --fail-level WARNING
        env:
          DEBUG: "false"
          SECRET_KEY: test-only-long-random-key-with-more-than-fifty-characters-89382
          ALLOWED_HOSTS: localhost
